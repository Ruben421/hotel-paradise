{% extends "base.html" %}
{% block title %}Mapa de ocupación{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="mb-0">Mapa de ocupación</h1>
    <p>Del {{ mapa.inicio|date:"j \d\e F" }} al {{ mapa.dias|last|date:"j \d\e F \d\e Y" }}.</p>
  </div>
  <div class="d-flex flex-wrap gap-2 align-items-center no-print">
    <form method="get" class="d-flex gap-2" data-autoenvio>
      <input type="hidden" name="inicio" value="{{ mapa.inicio|date:'Y-m-d' }}">
      <select class="form-select" name="tipo" aria-label="Tipo de habitación">
        <option value="">Todos los tipos</option>
        {% for v, l in tipos %}<option value="{{ v }}" {% if tipo == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select>
    </form>
    <div class="btn-group">
      <a class="btn btn-light" href="?inicio={{ anterior|date:'Y-m-d' }}&tipo={{ tipo }}" aria-label="Semana anterior"><i class="bi bi-chevron-left"></i></a>
      <a class="btn btn-light" href="?tipo={{ tipo }}">Hoy</a>
      <a class="btn btn-light" href="?inicio={{ siguiente|date:'Y-m-d' }}&tipo={{ tipo }}" aria-label="Semana siguiente"><i class="bi bi-chevron-right"></i></a>
    </div>
  </div>
</div>
<section class="panel panel-body">{% include "includes/rack.html" %}</section>
{% endblock %}
